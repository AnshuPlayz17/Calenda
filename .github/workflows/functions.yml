name: Deploy Edge Functions

# The owner has no working Supabase CLI on his machine -- `supabase login`
# ended in a macOS keychain prompt and the whole point of this file is that he
# never has to get past it. Merging deploys the functions, the same way
# deploy.yml already publishes the site.
#
# Only on changes under supabase/functions, because a deploy that runs on every
# merge to main is a deploy nobody reads the result of.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Fail rather than skip. The reminders workflow used to `exit 0` when it
      # was not configured, which is why nothing noticed that no reminder had
      # ever been sent: the job was green every hour and did nothing. A missing
      # secret is a broken deployment, and a broken deployment should be red.
      - name: Check the secrets exist
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "SUPABASE_ACCESS_TOKEN comes from supabase.com/dashboard/account/tokens"
            echo "  (scope it to this project: Project read, Edge Functions read-write)."
            echo "SUPABASE_PROJECT_REF is the ~20 characters in your project's dashboard URL."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # No function named, so every function under supabase/functions/ is
      # deployed. Adding one is then a matter of writing it, not of remembering
      # to add a line here.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: What is deployed now
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
