name: Send reminders

# Hourly, anchored to the creation minute rather than :00 so it does not queue
# behind everyone else's hourly jobs.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Nothing is sent from here. This only pokes the Edge Function, which
      # holds the credentials and does the work.
      #
      # THIS JOB USED TO LIE. It began with `if [ -z "$SUPABASE_FUNCTION_URL" ]
      # then echo skipping; exit 0`, and that secret was never set -- so from
      # the day it was written it ran every hour, printed one line, and passed.
      # Sixty green checks a day for a feature that had never delivered
      # anything, under a landing page with a whole panel about reminders and a
      # FACTS.md line calling notifications "verified live end-to-end".
      #
      # A missing configuration is a broken feature, and a broken feature has to
      # be red. The only thing worse than a job that fails is a job that passes
      # without doing its work, because nothing will ever prompt you to look.
      - name: Check configuration
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$REF" ] && missing="$missing SUPABASE_PROJECT_REF (secret)"
          [ -z "$ANON" ] && missing="$missing VITE_SUPABASE_ANON_KEY (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Reminders cannot be sent. Missing:$missing"
            echo "Until this is set, no reminder is delivered to anybody."
            exit 1
          fi

      # The URL is built from the project ref rather than stored as a fourth
      # secret. One less thing to set, and one less thing to set wrongly -- a
      # mistyped URL would have failed the same silent way.
      - name: Invoke the dispatcher
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # `--fail` used to be here, and it threw away the only evidence.
          # On 2026-09-11 at 06:04 UTC this step ended with
          #
          #   curl: (22) The requested URL returned error: 500
          #
          # and nothing else. The dispatcher's own 500 branch answers
          # {"error":"..."} naming what went wrong -- and --fail discards the
          # body, so the one sentence that would have explained the failure was
          # deleted by the thing reporting it. That is this project's recurring
          # bug from the other side: not a success signal detached from the
          # success, but a failure signal detached from the cause.
          #
          # The body is written to a file and printed before anything is
          # judged, so whatever the next 500 says survives to the log.
          http=$(curl --silent --show-error \
            -o response.json -w '%{http_code}' \
            -X POST "https://${REF}.supabase.co/functions/v1/notify-dispatch" \
            -H "Authorization: Bearer ${ANON}")

          echo "HTTP $http"
          cat response.json || true
          echo

          if [ "$http" != "200" ]; then
            echo "::error::The dispatcher answered HTTP $http. Its reply is printed above."
            exit 1
          fi

          # The function answers {"sent":n,"failed":n,"skipped":n}. A run where
          # everything failed is a passing curl and a broken feature, so it is
          # read rather than assumed.
          failed=$(sed -n 's/.*"failed":\([0-9]*\).*/\1/p' response.json)
          if [ -n "${failed:-}" ] && [ "$failed" -gt 0 ]; then
            echo "::error::$failed reminder(s) failed to send."
            exit 1
          fi
