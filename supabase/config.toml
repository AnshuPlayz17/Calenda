# Supabase project configuration.
#
# Used by the CLI for local development and by the GitHub integration, which
# applies anything new in supabase/migrations/ when it lands on the production
# branch.
project_id = "calenda"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
# Supabase's current default. Only affects `supabase start` locally.
major_version = 15

[auth]
# Overridden in the dashboard for the hosted project; these are local defaults.
enable_signup = true
enable_confirmations = false
