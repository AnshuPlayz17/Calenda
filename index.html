<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calenda</title>
    <meta name="description" content="Your personal school command centre." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are bundled, not fetched from Google. See src/styles/fonts.ts. -->
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('calenda.theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved)
          }
        } catch (_) {
          /* private browsing: fall back to the OS preference */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
